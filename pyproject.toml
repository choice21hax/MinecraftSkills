[project]
name = "minecraft-agent-toolkit"
version = "0.2.0"
description = "MCAT: deterministic Minecraft modpack, migration, mod-dev and debugging engine for Claude Code and Codex skills"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - internal use only" }
dependencies = [
    "httpx>=0.27",
    "keyring>=25",
    "pyyaml>=6",
    "tomli-w>=1.0",
]

[project.scripts]
mcat = "mcat.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcat"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "mcat/_data/templates"
"skills" = "mcat/_data/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits real provider APIs (opt-in: pytest -m network)",
    "build: runs real Gradle builds (opt-in: MCAT_RUN_BUILD_TESTS=1)",
]
addopts = "-m 'not network and not build'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501", "RUF059"]

[tool.mypy]
python_version = "3.12"
files = ["src/mcat"]
ignore_missing_imports = true
